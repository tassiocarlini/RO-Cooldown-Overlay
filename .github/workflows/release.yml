name: Gerar versão para Windows

# Roda sozinho quando você publica uma Release no GitHub
# (e também pode ser rodado à mão na aba "Actions").
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Gerar o programa (.exe)
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name "RO Cooldown Overlay"
          --add-data "banco_skills.json;."
          --collect-data sv_ttk
          --icon assets/icone.ico
          ro_cooldown_overlay.py

      - name: Montar o .zip
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt "dist/RO Cooldown Overlay/"
          $versao = if ($env:GITHUB_EVENT_NAME -eq "release") { $env:GITHUB_REF_NAME } else { "teste" }
          Compress-Archive -Path "dist/RO Cooldown Overlay" -DestinationPath "RO-Cooldown-Overlay-$versao-Windows.zip"

      - name: Guardar o .zip nesta execução
        uses: actions/upload-artifact@v4
        with:
          name: RO-Cooldown-Overlay-Windows
          path: "*.zip"

      - name: Anexar o .zip à Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
