name: Gerar versão para Windows

# Roda sozinho a cada envio para a main: se a versão do programa (VERSAO) ainda não tem
# Release, gera o .exe e publica a Release vX.Y.Z com o .zip e as novidades do CHANGELOG.
# O programa .exe baixa as atualizações dessa Release.
# Também pode ser rodado à mão na aba "Actions" (sem publicar nada, só gera o .zip).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyflakes

      # Roda em todo envio. Se falhar, a Release não sai.
      - name: Testes
        run: |
          python -m pyflakes rocd ro_cooldown_overlay.py tests empacotar.py
          python -m pytest -q

      - name: Ver se esta versão já tem Release
        id: versao
        shell: pwsh
        run: |
          $v = (Select-String -Path rocd/config.py -Pattern '^VERSAO = "([\d.]+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" *> $null
          $existe = $LASTEXITCODE -eq 0
          "gerar=$(-not $existe -or '${{ github.event_name }}' -eq 'workflow_dispatch')" >> $env:GITHUB_OUTPUT
          "publicar=$(-not $existe -and '${{ github.event_name }}' -eq 'push')" >> $env:GITHUB_OUTPUT
          Write-Host "Versão v$v - Release já existe: $existe"
          exit 0

      - name: Instalar o PyInstaller
        if: steps.versao.outputs.gerar == 'True'
        run: pip install pyinstaller==6.22.3

      - name: Gerar o programa (.exe)
        if: steps.versao.outputs.gerar == 'True'
        run: python empacotar.py

      - name: Guardar o .zip nesta execução
        if: steps.versao.outputs.gerar == 'True'
        uses: actions/upload-artifact@v7
        with:
          name: RO-Cooldown-Overlay-Windows
          path: dist/*.zip

      - name: Publicar a Release
        if: steps.versao.outputs.publicar == 'True'
        shell: pwsh
        run: |
          gh release create "${{ steps.versao.outputs.tag }}" (Get-Item dist/*.zip).FullName `
            --title "${{ steps.versao.outputs.tag }}" --notes-file dist/notas.md --target "$env:GITHUB_SHA"
